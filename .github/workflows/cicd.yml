name: Java CI with Gradle
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean bootJar

      - name: Get JAR_FILE
        id: jarfile
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v plain | head -n 1)
          echo "JAR_FILE=${JAR_FILE}" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ env.JAR_FILE }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: build/libs/

      - name: Setup SSH Key
        run: |
          printf '%s' "${{ secrets.AWS_EC2_KEY }}" | base64 --decode > private_key.pem
          chmod 600 private_key.pem
          ssh-keygen -y -f private_key.pem > /dev/null

      - name: Create runtime environment file
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          {
            printf 'GOOGLE_CLIENT_ID=%q\n' "${GOOGLE_CLIENT_ID:-disabled}"
            printf 'GOOGLE_CLIENT_SECRET=%q\n' "${GOOGLE_CLIENT_SECRET:-disabled}"
            printf 'DB_URL=%q\n' "$DB_URL"
            printf 'DB_USERNAME=%q\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%q\n' "$DB_PASSWORD"
            printf 'MAIL_USERNAME=%q\n' "$MAIL_USERNAME"
            printf 'MAIL_PASSWORD=%q\n' "$MAIL_PASSWORD"
            printf 'FILE_UPLOAD_PATH=%q\n' '/opt/kmarket/uploads'
          } > kmarket.env
          chmod 600 kmarket.env

      - name: Copy JAR to EC2
        run: |
          JAR_FILE=$(ls build/libs/*.jar | head -n 1)
          scp -i private_key.pem \
            -o StrictHostKeyChecking=no \
            $JAR_FILE \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:/home/${{ secrets.AWS_EC2_USER }}/kmarket.jar
          scp -i private_key.pem \
            -o StrictHostKeyChecking=no \
            kmarket.env \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:/home/${{ secrets.AWS_EC2_USER }}/kmarket.env
      
      - name: Restart Spring Application on EC2
        run: |
          ssh -i private_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << EOF
            pkill -f '/home/${{ secrets.AWS_EC2_USER }}/kmarket.jar' || true
            chmod 600 /home/${{ secrets.AWS_EC2_USER }}/kmarket.env
            set -a
            source /home/${{ secrets.AWS_EC2_USER }}/kmarket.env
            set +a
            mkdir -p /home/${{ secrets.AWS_EC2_USER }}/logs
            nohup java -jar /home/${{ secrets.AWS_EC2_USER }}/kmarket.jar \
              > /home/${{ secrets.AWS_EC2_USER }}/logs/app.log 2>&1 &
            echo \$! > /home/${{ secrets.AWS_EC2_USER }}/kmarket.pid
          EOF

      - name: Verify application process
        run: |
          sleep 20
          ssh -i private_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << EOF
            if ! kill -0 \$(cat /home/${{ secrets.AWS_EC2_USER }}/kmarket.pid); then
              tail -n 100 /home/${{ secrets.AWS_EC2_USER }}/logs/app.log
              exit 1
            fi
          EOF

      - name: Cleanup
        if: always()
        run: rm -f private_key.pem kmarket.env
