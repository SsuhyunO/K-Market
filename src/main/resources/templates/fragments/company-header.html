<!-- =============================================
     회사소개 전용 헤더 fragment
     사용법: <header th:replace="~{fragments/company-header :: header(active='home')}"></header>
     active 값: home | culture | news | career | media
     ============================================= -->
<header th:fragment="header(active)" class="company-header">
  <script th:if="${siteConfig != null and siteConfig.faviconFiled != 0}" th:inline="javascript">
    (() => {
      const faviconUrl = [[@{/files/{id}(id=${siteConfig.faviconFiled}, v=${siteConfig.faviconFiled})}]];
      let favicon = document.head.querySelector('link[rel~="icon"]');
      if (!favicon) {
        favicon = document.createElement('link');
        favicon.rel = 'icon';
        document.head.appendChild(favicon);
      }
      favicon.href = faviconUrl;
    })();
  </script>
  <script th:if="${siteConfig != null and !#strings.isEmpty(siteConfig.siteName)}" th:inline="javascript">
    document.title = document.title.replace(/K-?Market|케이마켓/gi, /*[[${siteConfig.siteName}]]*/ 'K-Market');
  </script>
  <div class="container company-header-inner">

    <!-- ① CI 로고 -->
    <div class="logo">
      <a th:href="@{/}">
        <img th:if="${siteConfig != null and siteConfig.headerLogoFiled != 0}"
             th:src="@{/files/{id}(id=${siteConfig.headerLogoFiled})}"
             th:alt="${siteConfig.siteName}"
             style="width:185px; height:60px; object-fit:contain; display:block;">
        <div th:if="${siteConfig == null or siteConfig.headerLogoFiled == 0}">
          <div class="logo-text"
               th:text="${siteConfig != null and !#strings.isEmpty(siteConfig.siteName) ? siteConfig.siteName : 'Kmarket'}">Kmarket</div>
          <div class="logo-sub"
               th:text="${siteConfig != null and !#strings.isEmpty(siteConfig.siteSubName) ? siteConfig.siteSubName : '㈜케이마켓'}">㈜케이마켓</div>
        </div>
      </a>
    </div>

    <!-- ② 회사소개 메뉴 -->
    <nav class="company-nav">
      <a th:href="@{/company/index}"
         th:class="${active == 'home'} ? 'active' : ''">HOME</a>
      <a th:href="@{/company/culture}"
         th:class="${active == 'culture'} ? 'active' : ''">기업문화</a>
      <a th:href="@{/company/story}"
         th:class="${active == 'story'} ? 'active' : ''">소식과 이야기</a>
      <a th:href="@{/company/recruit}"
         th:class="${active == 'recruit'} ? 'active' : ''">채용</a>
      <a th:href="@{/company/media}"
         th:class="${active == 'media'} ? 'active' : ''">미디어</a>
    </nav>

  </div>
</header>
