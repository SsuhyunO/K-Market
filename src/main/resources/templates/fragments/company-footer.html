<!-- =============================================
     회사소개 전용 간단 푸터 fragment (이미지 4 참고)
     ============================================= -->
<footer th:fragment="footer" class="company-footer">
  <div class="container company-footer-inner">
    <div class="company-footer-icon">📧</div>
    <nav class="company-footer-nav">
      <a th:href="@{/company/index}">HOME</a>
      <a th:href="@{/company/culture}">기업문화</a>
      <a th:href="@{/company/story}">소식과 이야기</a>
      <a th:href="@{/company/recruit}">채용</a>
      <a th:href="@{/company/media}">미디어</a>
    </nav>
    <p class="company-footer-copy"
       th:text="${siteConfig != null and !#strings.isEmpty(siteConfig.copyright) ? siteConfig.copyright : 'Copyright © Kmarket All rights Reserved'}">
      Copyright © Kmarket All rights Reserved
    </p>
  </div>
</footer>
